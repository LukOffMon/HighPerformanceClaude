name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate skill, manifests, agents, commands and dist zip
        run: python3 tools/validate.py
      - name: Smoke-test scripts on this repo
        run: |
          python3 skills/high-performance/scripts/repo_brief.py .
          python3 skills/high-performance/scripts/checks.py || test $? -eq 2
          python3 skills/iceberg/scripts/toolbelt.py .
          V="$(mktemp -d)"; export OBSIDIAN_VAULT="$V"
          python3 skills/iceberg/scripts/vault.py init
          echo "Goal: smoke test" | python3 skills/iceberg/scripts/vault.py save --title "CI smoke" --project hpc
          python3 skills/iceberg/scripts/vault.py lesson "CI lesson" --project hpc
          python3 skills/iceberg/scripts/vault.py context hpc | grep -q "CI lesson"
          python3 skills/iceberg/scripts/vault.py recall "smoke test" | grep -q "CI smoke"
      - name: GeekMcON app tests (vault, organizer, HTTP app, pairing, MCP bridge)
        run: python3 -m unittest discover -s apps/cekmecon/tests -v
      - name: Smoke-test installer
        run: |
          HOME="$(mktemp -d)" bash -c './install.sh && test -f "$HOME/.claude/skills/high-performance/SKILL.md" && test -f "$HOME/.claude/skills/iceberg/scripts/vault.py" && test -f "$HOME/.claude/skills/cekmecon/SKILL.md" && ./install.sh --uninstall'
      - uses: actions/upload-artifact@v4
        with:
          name: claude-ai-skills
          path: dist/*.zip
